# Expensive endpoints: curation, generation, interview, audio. A visitor makes
# these a few at a time, and each one can cost a model call, so the budget is
# deliberately tight.
limit_req_zone $binary_remote_addr zone=demoapi:10m rate=5r/s;

# Artwork images are a different kind of traffic and need their own budget.
# They are immutable, served from a local disk cache, and a gallery page
# legitimately asks for forty of them the instant it hydrates. Sharing the
# demoapi bucket meant every visitor's landing page lost most of its pictures
# to 503s — the first 15 passed and the rest were rejected outright, which is
# why it looked device- and browser-dependent (they differ in how many
# requests they open at once).
#
# Sized for one page load per visitor with headroom, and still bounded: a
# conference room behind one NAT address shares this address, so the ceiling
# has to clear several simultaneous visitors, not just one.
limit_req_zone $binary_remote_addr zone=demoimg:10m rate=120r/s;
