server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    # The backend runs with APP_ENV=development so the curation flow works
    # without an editor token and so the session cookie is not marked Secure
    # (a Secure cookie is dropped by the browser over plain HTTP). That same
    # setting lets require_admin through without a token, so the admin surface
    # is closed here at the edge instead — judges never need it.
    location ^~ /api/admin { return 404; }
    location ^~ /dev/admin { return 404; }

    # Artwork images, on their own budget. This must stay ABOVE the regex
    # location below and keep the ^~ modifier: a prefix match with ^~ wins
    # over a regex match, and without it every request here would fall back
    # into the tight demoapi bucket that caused the missing pictures.
    #
    # These are immutable reads out of the API's local disk cache, so the
    # burst is large and the responses are cacheable by the browser for a
    # week (the app sets max-age itself; nothing is added or overridden here).
    location ^~ /api/images/ {
        limit_req zone=demoimg burst=240 nodelay;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # Buffering ON, unlike the streaming routes below: these are small
        # finite files and buffering lets nginx free the upstream worker as
        # soon as the body is read.
        proxy_buffering on;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/(api|docs|redoc|openapi\.json) {
        limit_req zone=demoapi burst=15 nodelay;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }
}
